name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Upload macOS Intel snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: seamless-cors-snapshot-${{ github.run_number }}-macos-intel
          path: dist/*-macos-intel.tar.gz
          if-no-files-found: error

      - name: Upload macOS Apple Silicon snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: seamless-cors-snapshot-${{ github.run_number }}-macos-apple-silicon
          path: dist/*-macos-apple-silicon.tar.gz
          if-no-files-found: error

      - name: Upload Windows x64 snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: seamless-cors-snapshot-${{ github.run_number }}-windows-x64
          path: dist/*-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows ARM64 snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: seamless-cors-snapshot-${{ github.run_number }}-windows-arm64
          path: dist/*-windows-arm64.zip
          if-no-files-found: error

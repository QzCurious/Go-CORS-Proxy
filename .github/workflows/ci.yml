name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  npm-launcher:
    name: npm launcher (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["16", "18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test launcher.test.mjs
        working-directory: packaging/npm

  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: "0.6.0"
          node-version: "24"
          working-directory: packaging/npm
          package-manager-cache: false
      - run: make test
      - run: go vet ./...
      - run: make cross-build
      - run: nub --test
        working-directory: packaging/npm

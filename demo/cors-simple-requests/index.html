<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CORS Simple Request Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #090d18; color: #eef2ff; }
    main { width: min(760px, calc(100% - 32px)); }
    .eyebrow { color: #8ea2ff; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0; font-size: clamp(34px, 6vw, 58px); line-height: 1; letter-spacing: -.04em; }
    .intro { margin: 0 0 28px; color: #aeb7cd; font-size: 18px; line-height: 1.55; }
    .panel { padding: 24px; border: 1px solid #28314a; border-radius: 18px; background: #111729; box-shadow: 0 24px 80px #0008; }
    .label { margin-bottom: 8px; color: #7f8ba7; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    code { display: block; overflow-wrap: anywhere; color: #c7d1ff; font-size: 15px; }
    button { width: 100%; margin: 22px 0; padding: 14px 18px; border: 0; border-radius: 11px; background: #6d7cff; color: white; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #8290ff; }
    button:disabled { cursor: wait; opacity: .65; }
    .result { min-height: 146px; padding: 18px; border: 1px solid #29334d; border-radius: 12px; background: #0b1020; }
    .status { display: flex; align-items: center; gap: 10px; font-weight: 750; }
    .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 18px currentColor; }
    .idle .dot, .loading .dot { color: #7f8ba7; background: currentColor; }
    .blocked .dot { color: #ff657a; background: currentColor; }
    .success .dot { color: #43d69a; background: currentColor; }
    pre { margin: 14px 0 0; white-space: pre-wrap; color: #aeb7cd; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">CORS demo</div>
    <h1>Simple request</h1>
    <p class="intro">Send a cross-origin GET request to an API without CORS headers.</p>
    <section class="panel">
      <div class="label">Request</div>
      <code id="url">GET {{API_URL}}</code>
      <button id="send">Send simple request</button>
      <div id="result" class="result idle" aria-live="polite">
        <div class="status"><span class="dot"></span><span id="status">Ready</span></div>
        <pre id="details">No request sent.</pre>
      </div>
    </section>
  </main>
  <script>
    const button = document.querySelector('#send');
    const result = document.querySelector('#result');
    const status = document.querySelector('#status');
    const details = document.querySelector('#details');
    const url = document.querySelector('#url').textContent.slice(4);

    button.addEventListener('click', async () => {
      button.disabled = true;
      setResult('loading', 'Sending request…', 'GET ' + url);
      try {
        const response = await fetch(url);
        const body = await response.json();
        setResult(
          'success',
          'Request completed',
          'HTTP ' + response.status +
          '\n\n' + JSON.stringify(body, null, 2)
        );
      } catch (error) {
        setResult(
          'blocked',
          'Response unavailable',
          error.name + ': ' + error.message +
          '\n\nCheck DevTools and the API log for details.'
        );
      } finally {
        button.disabled = false;
        button.textContent = 'Retry the same request';
      }
    });

    function setResult(kind, heading, text) {
      result.className = 'result ' + kind;
      status.textContent = heading;
      details.textContent = text;
    }
  </script>
</body>
</html>
